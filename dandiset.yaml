releaseNotes: "## Changes since version 0.250624.0444\n\nAll 50 sessions were re-converted
  from the lab's source files with a new NeuroConv conversion ([catalystneuro/buzsaki-lab-to-nwb](https://github.com/catalystneuro/buzsaki-lab-to-nwb),
  PRs [#93](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/93), [#106](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/106)
  to [#108](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/108), [#111](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/111),
  [#113](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/113), [#116](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/116)
  and [#117](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/117)), and one
  session was added. The conversion fixes problems found by a reproduction attempt
  ([issue #78](https://github.com/catalystneuro/buzsaki-lab-to-nwb/issues/78)).\n\n
  **One file per session.** Each session's earlier `desc-raw` and `desc-processed`
  files are combined into one file, `sub-<rat>_ses-<session>_behavior+ecephys.nwb`
  (51 files, against 100 for 50 sessions before). The earlier files remain in the
  earlier versions.\n\n**New session**\n\n- **MS12-170715**, a session on the lab's
  share with spike sorting, cell metrics, trials and sleep scoring that was not in
  the dandiset. Its wide-band signal comes from the lab's `.dat`; the share has no
  `.lfp` for it, so it has no LFP.\n\n**Corrections**\n\n- **Electrode groups.** The
  LFP and wide-band columns are in `.dat` channel order, but the earlier electrodes
  table gave rows 0 to 9 to shank 1, 10 to 19 to shank 2 and so on, so the electrode
  groups were wrong in every file. Electrodes now follow the lab's `.xml` groups (anatomical
  groups where the spike groups leave channels out), with locations from session.mat.\n
  - **Trial times** are at the correct samples: the earlier fix used MATLAB's 1-based
  indices as 0-based, so trial times were one sample late (8.3 ms in MS21 and MS22,
  25 ms in MS10).\n- **Cooling states** use the lab's labels (Pre, Cooling, Post).
  Code 0 is \"transition (excluded)\", with its windows described, not \"Cooling off\"\
  .\n- **Temperature.** The measured septal probe trace (`temperature.mat`, 20 Hz)
  is `MeasuredTemperature` where it exists. Sessions with no measurement (MS10's,
  and MS12-170715) have the lab's modelled curve as `ModelledTemperature`, described
  as a model.\n- **Units.** Every Phy cluster, with a `quality` column. MS10's labels
  were not read before (12 good, 28 unsorted, 355 noise). The units description says
  that the curated set is the \"good\" units, which are the CellExplorer cells. Where
  a session was sorted more than once, the sorting the lab's analysis used is taken.\n
  - **LFP and wide-band** are the earlier files' data, stored as int16 at the session's
  gain (0.195 µV per step). Three sessions' earlier files hold only some channels
  (MS10-170314: 47 of 64; MS13-171129 and MS13-171130: 119 of 128); their series cover
  those channels.\n\n**Additions**\n\n- **Linearized position** (the earlier conversion's
  field check missed it).\n- **Tables:** `cooling` (no-cooling, cooling and the transition
  gaps), `epochs` from session.mat, and `sleep_states` where the lab's `SleepState.states.mat`
  exists, with HED tags (WAKE: Awake; NREM: Asleep; REM: Asleep and the SCORE library's
  Sleep-stage-REM).\n- **Units columns:** `cell_type`, `region`, `cell_metrics_id`
  and the largest-waveform channel for the CellExplorer cells.\n- **Ontology terms**
  (HERD) for species, sex, CA1 and the cell types.\n- Signals chunked for streaming.\n
  \n**Known gaps**\n\n- The 2018-07-19 sessions are labelled as cooled, but their
  measured temperature is flat. The lab's labels are kept, and the descriptions say
  so.\n- The left/right trial label is the trial's side arm, not the direction run,
  so it has no HED tag.\n- Not in the dandiset, as before: MS12-170712, MS13-171204
  and 171205 (the share has their `.dat` and trials but no spike sorting), and MS13-171206
  (trials only, no recording).\n- Not converted: MS10's 120 Hz OptiTrack Take files,
  place fields and ripples."
